name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (net472 / WPF)
        run: msbuild LolLauncher\LolLauncher.csproj /restore /p:Configuration=Release /p:Platform=AnyCPU /v:minimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LolLauncher-net472
          path: |
            LolLauncher/bin/Release/net472/LolLauncher.exe
            LolLauncher/bin/Release/net472/LolLauncher.exe.config
            docs/使用说明.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            LolLauncher/bin/Release/net472/LolLauncher.exe
            LolLauncher/bin/Release/net472/LolLauncher.exe.config
            docs/使用说明.txt
